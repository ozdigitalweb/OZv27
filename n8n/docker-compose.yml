services:
  postgres:
    image: postgres:16-alpine
    container_name: oz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ozadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oz_secure_pg_2026}
      POSTGRES_DB: ${POSTGRES_DB:-n8n_ozdigital}
    volumes:
      - oz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozadmin} -d ${POSTGRES_DB:-n8n_ozdigital}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oz_network

  n8n:
    image: n8nio/n8n:latest
    container_name: oz-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_ozdigital}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-ozadmin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-oz_secure_pg_2026}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-oz_digital_n8n_encryption_key_2026_change_me}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - oz_n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oz_network

volumes:
  oz_postgres_data:
  oz_n8n_data:

networks:
  oz_network:
    name: oz_digital_network
    driver: bridge
